name: Build and Release Toolchain

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
            pkg_dir: install-amd64
            tar_name: gap9-gcc-ubuntu22.04-amd64.tar.gz
          - arch: arm64
            platform: linux/arm64
            pkg_dir: install-arm64
            runner: ubuntu-22.04-arm
            tar_name: gap9-gcc-ubuntu22.04-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        run: |
          docker buildx build \
            --platform=${{ matrix.platform }} \
            --tag builder:${{ matrix.arch }} \
            --load \
            --file .github/scripts/Dockerfile .

      - name: Build toolchain
        run: |
          docker run --rm \
            --platform=${{ matrix.platform }} \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            builder:${{ matrix.arch }} \
            bash -lc "make -f Makefile.gap PKG_DIR=/workspace/${{ matrix.pkg_dir }} build -j$(nproc)"

      - name: Package toolchain
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -czf "${{ matrix.tar_name }}" "${{ matrix.pkg_dir }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tar_name }}
          path: ${{ matrix.tar_name }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/gap9-gcc-ubuntu22.04-amd64.tar.gz
            dist/**/gap9-gcc-ubuntu22.04-arm64.tar.gz
